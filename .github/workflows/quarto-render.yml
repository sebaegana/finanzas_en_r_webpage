name: Render Quarto Site

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libglpk40

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Verify and Restore Dependencies
        run: |
          Rscript -e "renv::restore()"

      - name: Install Additional Packages
        run: |
          Rscript -e "install.packages('reticulate')"

      - name: Install TinyTeX
        run: |
          for i in {1..3}; do
            quarto install tinytex && break || sleep 10
          done

      - name: Render Quarto Site
        run: |
          # Render all files except clases folder to keep it frozen
          find . -maxdepth 1 -name "*.qmd" -type f -exec quarto render {} \;
          find ./clases_ia -name "*.qmd" -type f -exec quarto render {} \;
          # Also render clases/index.qmd to maintain the listing page
          quarto render clases/index.qmd

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Regenerate site with Quarto" && git push)
